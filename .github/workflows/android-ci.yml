name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: google-services.json 복원 (Secrets)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: 서명 키(도장) 복원 (Secrets)
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/sinjeong-release.jks

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 디버그 APK 빌드 (폰 테스트용)
        run: gradle :app:assembleDebug

      - name: 정식 AAB 빌드 (플레이스토어용, 도장 찍힘)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sinjeong-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sinjeong-safety-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: AAB 업로드 (플레이스토어 제출용)
        uses: actions/upload-artifact@v4
        with:
          name: sinjeong-safety-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
